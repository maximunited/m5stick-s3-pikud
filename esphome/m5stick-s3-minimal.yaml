# Temporary boot/WiFi test — flash with:
#   esphome run m5stick-s3-minimal.yaml --device /dev/ttyACM0
substitutions:
  name: m5stick-s3
  friendly_name: M5Stick S3

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.5.0
  platformio_options:
    board_build.arduino.memory_type: qio_opi
    build_flags:
      - -DESP32S3
      - -DBOARD_HAS_PSRAM
      - -mfix-esp32-psram-cache-issue
      - -DARDUINO_USB_CDC_ON_BOOT=1
      - -DARDUINO_USB_MODE=1

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "M5Stick-S3 Fallback"
    password: !secret ap_password

logger:
  level: DEBUG
  baud_rate: 0
  hardware_uart: USB_SERIAL_JTAG

captive_portal:
