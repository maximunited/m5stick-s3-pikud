binary_sensor:
  - platform: gpio
    id: key1
    name: "Button A"
    pin:
      number: GPIO11
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      then:
        - lambda: 'id(btn_a_long_fired) = false;'
        - delay: 800ms
        - if:
            condition:
              and:
                - binary_sensor.is_on: key1
                - lambda: 'return !id(btn_a_long_fired);'
            then:
              - lambda: 'id(btn_a_long_fired) = true;'
              - script.execute: pikud_dismiss
    on_release:
      then:
        - if:
            condition:
              lambda: 'return !id(btn_a_long_fired);'
            then:
              - script.execute: button_a_release

  - platform: gpio
    id: key2
    name: "Button B"
    pin:
      number: GPIO12
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
    on_press:
      then:
        - script.execute: button_b_short
