name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Block committed secrets
        run: |
          test ! -f esphome/secrets.yaml
          if grep -RInE '(wifi_password|api_encryption_key|ota_password):' esphome --include='*.yaml' | grep -v secrets.yaml.sample; then
            echo "Possible secret committed under esphome/"
            exit 1
          fi

      - name: YAML lint
        run: |
          pip install yamllint
          yamllint -d relaxed esphome homeassistant .github

      - name: ESPHome config validate
        run: |
          pip install 'esphome>=2024.12.0'
          API_KEY="$(python3 -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())')"
          cat > esphome/secrets.yaml <<EOF
          wifi_ssid: "ci-test"
          wifi_password: "ci-test"
          api_encryption_key: "${API_KEY}"
          ota_password: "74834136cea7d5c5b6671194481f085f"
          ap_password: "ci-fallback"
          EOF
          cd esphome
          esphome config m5stick-s3.yaml
